{{- if and .Values.admin.token (not .Values.admin.existingSecret) }}
{{- if lt (len .Values.admin.token) 16 }}
{{- fail "admin.token must be at least 16 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shortener.adminSecret" . }}
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.admin.secretKey }}: {{ .Values.admin.token | b64enc | quote }}
{{- end }}
{{- if and .Values.protection.secrets (not .Values.protection.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shortener.protectionSecret" . }}
  labels:
    {{- include "shortener.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $name, $value := .Values.protection.secrets }}
  {{ $name }}: {{ $value | toString | b64enc | quote }}
  {{- end }}
{{- end }}
