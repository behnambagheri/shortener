# Usage: create a .env file next to this file (see .env.example), then `docker compose up -d`.
services:
  shortener:
    image: ghcr.io/behnambagheri/shortener:${SHORTENER_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${SHORTENER_PORT:-8080}:8080"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CANONICAL_ORIGIN: ${CANONICAL_ORIGIN:-}
      # Admin sign-in at /admin. Generate with: openssl rand -hex 32
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Optional defaults; the admin area can override them.
      APPROVED_DOMAINS: ${APPROVED_DOMAINS:-}
      # Optional Cloudflare Access sign-in, when the service sits behind Access.
      ACCESS_ISSUER: ${ACCESS_ISSUER:-}
      ACCESS_AUD: ${ACCESS_AUD:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Optional abuse protection; see .env.example and the README.
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      ABUSE_EMAIL: ${ABUSE_EMAIL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SAFE_BROWSING_API_KEY: ${SAFE_BROWSING_API_KEY:-}
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - shortener-data:/var/lib/shortener
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  shortener-data:
