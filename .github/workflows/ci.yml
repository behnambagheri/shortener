name: CI
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Let publishing and deployment finish; supersede only pull request checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: bash -n scripts/smoke-container.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: helm lint charts/shortener --strict
      - run: helm template shortener charts/shortener --set ingress.enabled=true --set admin.token=ci-admin-token-0123456789 > /dev/null
  container:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shortener:test
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: bash scripts/smoke-container.sh shortener:test
  publish:
    if: github.event_name != 'pull_request'
    needs: [validate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: BUILD_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - name: Package Helm chart
        run: helm package charts/shortener --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/shortener-*.tgz
  deploy-worker:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [validate, container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: shortener-cloudflare
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 65a8188637073a50148b1e6e59e1c1a9
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply bea-shortener --remote
      - run: npx wrangler deploy --var DEPLOYMENT_SHA:${GITHUB_SHA}
      - run: node scripts/smoke.mjs https://s.bea.sh "$GITHUB_SHA"
